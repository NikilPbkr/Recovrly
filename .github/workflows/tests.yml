name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        # app.py constructs an OpenAI client at import. The suite never calls
        # the API; a placeholder satisfies the constructor. Not a repository secret.
        env:
          OPENAI_API_KEY: test-key-not-used
        run: python -m unittest discover -s tests -t .
